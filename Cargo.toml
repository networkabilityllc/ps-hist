[package]
name = "ps-hist"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
gethostname = "1.1.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
textwrap = "0.16.4"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
